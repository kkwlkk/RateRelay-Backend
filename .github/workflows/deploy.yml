name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        run: |
          DEPLOYMENT_DIR="/home/$(whoami)/raterelay-deployment"
          
          cd $DEPLOYMENT_DIR
          
          # Update code
          git -C backend pull origin main
          
          # Rebuild and restart
          docker-compose build backend
          docker-compose up -d backend
          
          # Clean up old images
          docker image prune -f