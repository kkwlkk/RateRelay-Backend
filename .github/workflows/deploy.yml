name: Deploy Backend

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend
        run: |
          set -e
          cd /root/raterelay-deployment
          
          rm -rf backend/*
          
          cp -r $GITHUB_WORKSPACE/* backend/ 2>/dev/null || true
          cp $GITHUB_WORKSPACE/.dockerignore backend/ 2>/dev/null || true
          cp $GITHUB_WORKSPACE/.gitignore backend/ 2>/dev/null || true
          
          docker-compose build backend
          
          docker-compose stop backend
          docker-compose up -d backend nginx
          
          docker image prune -f